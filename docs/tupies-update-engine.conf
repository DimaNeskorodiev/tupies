# Install as a reviewed systemd drop-in for the existing Engine unit.
# Keep its User, EnvironmentFile, data directory, TLS and port settings intact.
[Service]
WorkingDirectory=/opt/tupies/current
ExecStart=
ExecStart=/usr/bin/node /opt/tupies/current/server.mjs
Environment=STUDIO_UPDATE_HOLD_FILE=/var/lib/tupies-updater/hold
# Optional "Update now" button (see tupies-update-request.path). The folder belongs to the Engine
# account, mode 0700, and holds nothing but the request file:
#   install -d -o ENGINE_ACCOUNT -g ENGINE_ACCOUNT -m 0700 /var/lib/tupies-update-request
#Environment=STUDIO_UPDATE_REQUEST_FILE=/var/lib/tupies-update-request/request
#ReadWritePaths=/var/lib/tupies-update-request
