# Install as a reviewed systemd drop-in for the existing Engine unit.
# Keep its User, EnvironmentFile, data directory, TLS and port settings intact.
[Service]
WorkingDirectory=/opt/tupies/current
ExecStart=
ExecStart=/usr/bin/node /opt/tupies/current/server.mjs
Environment=STUDIO_UPDATE_HOLD_FILE=/var/lib/tupies-updater/hold
